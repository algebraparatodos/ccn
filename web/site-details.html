<!-- =========================================================
     CCN – SITE DETAILS (Kajabi)
     =========================================================

     Esto es lo que va pegado en el campo "Site Details" de Kajabi,
     y desde el 21/08/2026 es TODO lo que va: el resto se bajó a
     archivos de este repo y lo sirve el Worker.

     Antes acá vivían trescientas líneas —tipografías, cookies,
     ManyChat, el arreglo de anclas, la traducción de la página de
     descargas y el chatbot—, y para cambiar cualquier cosa había que
     entrar a Kajabi y editar a mano, sin historial y sin poder ver qué
     cambió.

     LO QUE SE QUEDA ACÁ, Y POR QUÉ CADA COSA
     -----------------------------------------

     1. Los dos <meta> de verificación. Los robots de Pinterest y de
        Facebook que comprueban el dominio NO ejecutan JavaScript: si
        se inyectaran, la verificación del dominio se rompería.

     2. El píxel de Meta. Podría moverse, pero es el único bloque donde
        un fallo silencioso cuesta plata: si el Worker no respondiera,
        se perdería la atribución de los anuncios sin que nadie se
        entere. Y es código que no se cambia nunca. Se queda como
        seguro barato.

     3. Las dos etiquetas que apuntan al Worker.

     El <script> lleva `defer`, y eso no es decorativo: hace que el
     código corra después de que el HTML esté leído y ANTES de que se
     dispare DOMContentLoaded, o sea igual que cuando estaba pegado
     acá. Sin `defer` cambiaría el momento en que corre todo.

     PARA CAMBIAR CUALQUIER OTRA COSA NO SE ENTRA ACÁ
     ------------------------------------------------
     Se edita el archivo en este repo y se hace push. El cambio se ve
     en la web dentro del minuto siguiente (el Worker cachea 60
     segundos, a propósito).

       Tipografías y estilos ....... web/estilos.css
       Aviso de cookies ............ web/partes/10-cookies.js
       ManyChat .................... web/partes/20-manychat.js
       Anclas y header sticky ...... web/partes/30-anclas.js
       Traducción de /downloads/ ... web/partes/40-downloads.js
       El chatbot Clay ............. chatbot/ccn-chatbot.js
     ========================================================= -->

!function(f,b,e,v,n,t,s){
if(f.fbq)return;
n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];
t=b.createElement(e);t.async=!0;
t.src=v;
s=b.getElementsByTagName(e)[0];

}(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');

fbq('init', '1376271230773768');

document.addEventListener('click', function (e) {
  var el = e.target.closest('a, button');
  if (!el) return;
  var href = (el.getAttribute('href') || '').toLowerCase();
  if (
    href.includes('mpago') ||
    href.includes('mercadopago') ||
    href.includes('/offers/') ||
    href.includes('checkout')
  ) {
    fbq('track', 'InitiateCheckout');
  }
});
</script>
