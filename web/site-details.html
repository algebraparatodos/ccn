<!-- ===============================
     FIX ANCLAS + HEADER STICKY (v5 – no rompe popups / hashes “virtuales”)
     =============================== -->
<script>
(function () {

  function isMobile() {
    return window.matchMedia && window.matchMedia('(max-width: 768px)').matches;
  }

  function getStickyHeaderHeight() {
    var candidates = Array.from(document.querySelectorAll(
      'header, .header, .header__content, .header__content--desktop, .header__content--mobile, .announcement, .topbar, .nav, .navbar'
    ));

    var topBar = candidates
      .map(function (el) {
        var cs = getComputedStyle(el);
        var r = el.getBoundingClientRect();
        return { el: el, cs: cs, r: r };
      })
      .filter(function (x) {
        var pos = x.cs.position;
        var isStickyOrFixed = (pos === 'fixed' || pos === 'sticky');
        return isStickyOrFixed && x.r.top <= 1 && x.r.height > 30;
      })
      .sort(function (a, b) { return b.r.height - a.r.height; })[0];

    return topBar ? Math.round(topBar.r.height) : 0;
  }

  function findTargetFromHash(hash) {
    if (!hash || hash.length < 2) return null;
    var id = decodeURIComponent(hash.slice(1));

    var t = document.getElementById(id);
    if (t) return t;

    try { return document.querySelector('[name="' + CSS.escape(id) + '"]'); }
    catch (e) { return document.querySelector('[name="' + id.replace(/"/g, '\\"') + '"]'); }
  }

  function doScroll(hash) {
    var target = findTargetFromHash(hash);
    if (!target) return;

    var headerH = getStickyHeaderHeight();

    // 👇 ACÁ ajustás aire:
    var extra = isMobile() ? 2 : 12;

    var y = target.getBoundingClientRect().top + window.pageYOffset - headerH - extra;

    window.scrollTo({ top: y, behavior: 'smooth' });
  }

  function scrollWithRetries(hash) {
    doScroll(hash);
    setTimeout(function(){ doScroll(hash); }, 80);
    setTimeout(function(){ doScroll(hash); }, 220);
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href*="#"]');
    if (!a) return;

    var href = a.getAttribute('href') || '';
    var idx = href.indexOf('#');
    if (idx === -1) return;

    var hash = href.slice(idx);
    if (!hash || hash === '#') return;

    // ✅ Si NO existe un elemento con ese id/name, NO es un ancla real:
    //    lo dejamos pasar para que Kajabi abra popups (#cta-popup, etc.)
    var target = findTargetFromHash(hash);
    if (!target) return;

    // 🔥 clave: evitar que otros handlers hagan scroll luego
    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();

    if (window.location.hash !== hash) history.pushState(null, '', hash);
    scrollWithRetries(hash);
  }, true);

  window.addEventListener('load', function () {
    if (!window.location.hash) return;

    // ✅ si no existe target, no scrolleamos (popups / hashes “virtuales”)
    var t = findTargetFromHash(window.location.hash);
    if (!t) return;

    scrollWithRetries(window.location.hash);
  });

  window.addEventListener('hashchange', function () {
    if (!window.location.hash) return;

    var t = findTargetFromHash(window.location.hash);
    if (!t) return;

    scrollWithRetries(window.location.hash);
  });

})();
</script>

<!-- ===============================
     TRADUCCIÓN PÁGINA DOWNLOADS (Files / Download All → español)
     =============================== -->
<script>
(function () {
  if (!window.location.pathname.startsWith('/downloads/')) return;

  var traducciones = {
    'Files': 'Archivos',
    'Download All': 'Descargar todo'
  };

  function traducirNodo(nodo) {
    if (nodo.nodeType === Node.TEXT_NODE) {
      var texto = nodo.nodeValue.trim();
      if (traducciones[texto]) {
        nodo.nodeValue = nodo.nodeValue.replace(texto, traducciones[texto]);
      }
      var match = nodo.nodeValue.match(/^(\d+)\s+files?(\s*[•·]\s*.+)?$/);
      if (match) {
        var cantidad = match[1];
        var resto = match[2] || '';
        nodo.nodeValue = cantidad + ' archivo' + (cantidad === '1' ? '' : 's') + resto;
      }
    } else if (nodo.nodeType === Node.ELEMENT_NODE) {
      nodo.childNodes.forEach(traducirNodo);
    }
  }

  function iniciar() {
    if (!document.body) {
      setTimeout(iniciar, 50);
      return;
    }
    traducirNodo(document.body);
    var observer = new MutationObserver(function () {
      traducirNodo(document.body);
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  iniciar();
})();
</script>

<!-- ===============================
     CHATBOT CCN (Clay) — carga desde GitHub raw, sin caché de ningún tipo

     Antes esto era una etiqueta <script src> apuntando a jsDelivr, y el
     comentario de arriba ya mentía: jsDelivr cachea la rama hasta 12
     horas, y encima sirve el archivo con caché de navegador de 7 días.
     El 21/08/2026 eso dejó a Clay roto en la web durante horas después
     de que el arreglo ya estuviera hecho y subido.

     Bajándolo con fetch y sin caché, un arreglo se ve en la visita
     siguiente. Si GitHub falla, cae solo a jsDelivr: más lento en
     enterarse de un cambio, pero no se cae nunca.

     Es el mismo camino que ya usa la web de Mateo.
     =============================== -->
<script>
(function () {
  var RAW = "https://raw.githubusercontent.com/algebraparatodos/ccn/main/chatbot/ccn-chatbot.js";
  var CDN = "https://cdn.jsdelivr.net/gh/algebraparatodos/ccn@main/chatbot/ccn-chatbot.js";

  function colgar(script) {
    // documentElement siempre existe, incluso mientras se lee el <head>.
    (document.head || document.documentElement).appendChild(script);
  }

  fetch(RAW + "?nocache=" + Date.now(), { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("GitHub respondio " + res.status);
      return res.text();
    })
    .then(function (codigo) {
      var s = document.createElement("script");
      s.textContent = codigo;
      colgar(s);
    })
    .catch(function (err) {
      console.warn("Clay: no se pudo bajar de GitHub, se usa el CDN.", err);
      var s = document.createElement("script");
      s.src = CDN;
      colgar(s);
    });
})();
</script>
